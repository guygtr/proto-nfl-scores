<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d33">
  <title>Pointage NFL en direct</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏈</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1>🏈 Pointage NFL</h1>
      <p id="week" class="sub">Chargement…</p>
    </div>
    <div class="refresh">
      <span id="dot" class="dot"></span>
      <span id="updated">—</span>
      <button id="reload" type="button" aria-label="Rafraîchir">↻</button>
    </div>
  </header>
  <main>
    <p id="error" class="error" hidden></p>
    <section>
      <h2>⭐ Mes équipes</h2>
      <div id="favs" class="grid"></div>
    </section>
    <section>
      <h2>Tous les matchs</h2>
      <div id="games" class="grid"></div>
    </section>
  </main>
  <footer>Données : ESPN (non officiel) · Rafraîchi aux 30 secondes</footer>
  <script src="app.js"></script>
</body>
</html>
