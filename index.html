<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070b16">
  <meta name="color-scheme" content="dark">
  <title>Pointage NFL en direct</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#contenu">Aller aux matchs</a>
  <header class="top glass">
    <div class="top__titre">
      <h1><span aria-hidden="true">🏈</span> Pointage <span class="neon">NFL</span></h1>
      <p id="week" class="sub">Chargement…</p>
    </div>
    <div class="top__maj">
      <p class="maj" role="status" aria-live="polite"><span id="dot" class="dot" aria-hidden="true"></span><span id="updated">—</span></p>
      <button id="reload" class="btn-neon btn-icone" type="button" aria-label="Rafraîchir les pointages" title="Rafraîchir">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.95 7.95 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </div>
  </header>
  <main id="contenu">
    <p id="error" class="alerte" role="alert" hidden></p>
    <section aria-labelledby="t-favs">
      <h2 id="t-favs" class="section-titre"><span aria-hidden="true">⭐</span> Mes équipes</h2>
      <div id="favs" class="grid"><div class="carte squelette" aria-hidden="true"></div></div>
    </section>
    <section aria-labelledby="t-games">
      <h2 id="t-games" class="section-titre">Tous les matchs <span id="count" class="compte"></span></h2>
      <div id="games" class="grid"><div class="carte squelette" aria-hidden="true"></div><div class="carte squelette" aria-hidden="true"></div></div>
    </section>
  </main>
  <footer class="pied">
    <p>Données : ESPN (non officiel) · Rafraîchi aux 30 secondes · Heures de Toronto</p>
    <p class="credit">© GTR Technologies Inc. · Tous droits réservés.<br>Site réalisé par la GTR-Teams</p>
  </footer>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
